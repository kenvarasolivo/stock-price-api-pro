services:
  - type: web
    name: stock-price-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RAPIDAPI_SECRET
        sync: false   # You'll fill this in manually on the Render dashboard
    autoDeploy: true
